name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew --no-daemon testStudentDebugUnitTest testTeacherDebugUnitTest
      - name: Build both apps
        run: ./gradlew --no-daemon assembleStudentDebug assembleTeacherDebug
      - uses: actions/upload-artifact@v4
        with:
          name: english-quiz-student-apk
          path: app/build/outputs/apk/student/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: english-quiz-teacher-apk
          path: app/build/outputs/apk/teacher/debug/*.apk
