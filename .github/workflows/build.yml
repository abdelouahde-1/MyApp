name: Build APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew --no-daemon testStudentDebugUnitTest testTeacherDebugUnitTest
      - name: Build both apps
        run: ./gradlew --no-daemon assembleStudentDebug assembleTeacherDebug
      - uses: actions/upload-artifact@v4
        with:
          name: english-quiz-student-apk
          path: app/build/outputs/apk/student/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: english-quiz-teacher-apk
          path: app/build/outputs/apk/teacher/debug/*.apk

  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Build and upload the APK first, so it is available even if the tests fail.
      - name: Build Reel
        run: ./gradlew --no-daemon :reel:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reel-apk
          path: reel/build/outputs/apk/debug/*.apk
      - name: Test Reel (records UI screenshots)
        run: ./gradlew --no-daemon :reel:testDebugUnitTest -Proborazzi.test.record=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel-screenshots
          path: reel/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

  player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Reel Player
        run: ./gradlew --no-daemon :player:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reel-player-apk
          path: player/build/outputs/apk/debug/*.apk
      - name: Test Reel Player
        run: ./gradlew --no-daemon :player:testDebugUnitTest
